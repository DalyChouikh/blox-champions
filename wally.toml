[package]
name = "dalychouikh/blox-champions"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

# Jest Roblox's dev packages depend on shared ones, which Wally places with React in ReplicatedStorage.Packages.
[place]
shared-packages = "game.ReplicatedStorage.Packages"

[dependencies]
React = "roblox/react@17.3.13"
ReactRoblox = "roblox/react-roblox@17.3.13"

[dev-dependencies]
Jest = "roblox/jest@3.20.1"
JestGlobals = "roblox/jest-globals@3.20.1"
