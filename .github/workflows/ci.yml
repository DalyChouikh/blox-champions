name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository; the token is passed to Rokit to read GitHub releases.
permissions:
  contents: read

# actions/checkout runs `git init`, and git prints a 13-line hint about the initial branch's name unless
# init.defaultBranch is set: these set it for every git command in the jobs.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Both jobs name their image, Ubuntu 26.04 (Python 3.14): GitHub moves ubuntu-latest to it from 2026-10-19 to
# 11-19 (actions/runner-images#14748) and notes that in every job that asks for ubuntu-latest.
jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (rokit.toml)
        run: bash scripts/install-toolchain.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install packages (and re-export their types)
        run: bash scripts/install-packages.sh

      - name: Check formatting
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src tests scripts

      - name: Type check
        run: bash scripts/analyze.sh

      # Python prints some warnings without failing the run (a finalizer's ResourceWarning, say), so the step also
      # fails when the unit tests print one.
      - name: Check the CI scripts (Python)
        run: |
          ruff format --check scripts
          ruff check scripts
          output=$(python3 -m unittest discover -s scripts/ci -p "test_*.py" 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          if grep -qi "warning" <<< "$output"; then echo "::error::The Python unit tests printed a warning."; exit 1; fi

      - name: Build game and test places
        run: |
          mkdir -p build
          rojo build default.project.json --output build/game.rbxl
          rojo build test.project.json --output build/test.rbxl

  # The whole Jest suite in Roblox's cloud (Open Cloud Luau Execution), against the place version this job uploads.
  cloud-tests:
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A pull request's newer push cancels its older run. Every push to main gets its own group, because GitHub
    # cancels a group's pending job whatever cancel-in-progress says.
    concurrency:
      group: cloud-tests-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (rokit.toml)
        run: bash scripts/install-toolchain.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install packages
        run: bash scripts/install-packages.sh

      - name: Build the test place
        run: |
          mkdir -p build
          rojo build test.project.json --output build/test.rbxl

      - name: Run the test suite in Roblox's cloud
        run: python3 scripts/ci/cloud_tests.py build/test.rbxl scripts/ci/run-tests-task.luau
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
