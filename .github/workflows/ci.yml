name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install packages (and re-export their types)
        run: bash scripts/install-packages.sh

      - name: Check formatting
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src tests scripts

      - name: Type check
        run: bash scripts/analyze.sh

      - name: Build game and test places
        run: |
          mkdir -p build
          rojo build default.project.json --output build/game.rbxl
          rojo build test.project.json --output build/test.rbxl
