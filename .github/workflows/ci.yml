name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install packages
        run: wally install

      - name: Download Roblox type definitions
        run: curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau

      - name: Generate sourcemap
        run: rojo sourcemap test.project.json --output sourcemap.json

      - name: Check formatting
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src tests scripts

      - name: Type check
        run: >-
          luau-lsp analyze
          --platform=roblox
          --sourcemap=sourcemap.json
          --definitions=@roblox=globalTypes.d.luau
          --base-luaurc=.luaurc
          --ignore="DevPackages/**"
          --ignore="Packages/**"
          src tests scripts

      - name: Build game and test places
        run: |
          mkdir -p build
          rojo build default.project.json --output build/game.rbxl
          rojo build test.project.json --output build/test.rbxl
