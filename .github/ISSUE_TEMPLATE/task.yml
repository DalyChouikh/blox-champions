name: Task
description: A unit of planned work
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this task delivers.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist that must be true when the task is done.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan / spec link
      description: Link to the plan task or spec section.
